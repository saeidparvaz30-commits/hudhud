[project]
name = "hudhud-hub"
version = "0.0.1"
description = "Hudhud hub: library, sync, vault writer and semantic search"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Saeidparvaz30-commits", email = "saeidparvaz30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "platformdirs>=4.12.4",
    "pymupdf>=1.28.2",
    "python-ulid>=4.0.1",
    "qrcode>=8.2",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
hudhud = "hudhud_hub.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
