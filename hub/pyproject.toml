[project]
name = "hudhud-hub"
version = "0.0.1"
description = "Hudhud hub: library, sync, vault writer and semantic search"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Saeidparvaz30-commits", email = "saeidparvaz30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.12.4",
    "pymupdf>=1.28.2",
    "python-ulid>=4.0.1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
