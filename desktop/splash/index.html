<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hudhud</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: #f4ecd8; color: #7a6a58;
        font: 15px system-ui, sans-serif;
      }
      .box { text-align: center; }
      svg { width: 72px; height: 72px; animation: rise 1.6s ease-in-out infinite alternate; }
      @keyframes rise { from { transform: translateY(2px); } to { transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) { svg { animation: none; } }
    </style>
  </head>
  <body>
    <div class="box">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M18 44c4-14 12-22 24-24-4 4-6 8-6 12 4-2 8-2 12 0-6 2-10 6-12 12z" fill="#8a5a2b"/>
        <path d="M26 22l-4-8 7 6 1-9 3 9 5-6-3 9" fill="none" stroke="#3b2f2f" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="34" cy="30" r="1.8" fill="#3b2f2f"/>
      </svg>
      <p>Starting Hudhud…</p>
    </div>
  </body>
</html>
