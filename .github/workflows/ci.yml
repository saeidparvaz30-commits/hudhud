name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project hub pytest hub/tests
      - run: uv run --project hub ruff check .

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm --dir client install --frozen-lockfile
      - run: pnpm --dir client typecheck
      - run: pnpm --dir client lint
      - run: pnpm --dir client test
      - run: pnpm --dir client build
      - uses: astral-sh/setup-uv@v6
      - run: pnpm --dir client exec playwright install --with-deps chromium
      - run: pnpm --dir client e2e
